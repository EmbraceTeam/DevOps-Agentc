[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsctl"
version = "0.1.0"
description = "运维资源元数据管理 CLI，可注册为 Hermes Agent 插件"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Angle" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
opsctl = "opsctl.cli:main"

# 注: Hermes 插件集成走目录插件通道 (仓库根 plugin.yaml + __init__.py),
# 不再注册 hermes_agent.plugins entry point, 避免与目录插件双通道冲突.
# 安装: hermes plugins install <git-url>; 更新: hermes plugins update opsctl-plugin

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opsctl = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
